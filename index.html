
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Art the Clown — Horror Countdown</title>

<style>
:root {
  --blood: #ff1717;
  --gold: #ffd36a;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
  font-family: Impact, Haettenschweiler,
               "Arial Narrow Bold", sans-serif;
}

.stage {
  position: relative;
  width: min(100vw, 150vh);
  aspect-ratio: 3 / 2;
  margin: auto;
  overflow: hidden;
  background: transparent url("./countdown.png")
              center / 100% 100% no-repeat;
}

/* COUNTDOWN PANEL */

.countdown {
  position: absolute;
  left: 25.2%;
  top: 55.2%;
  width: 65.5%;
  height: 31.2%;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 1.5% 2%;
  text-align: center;
}

/* HEADING */

.eyebrow {
  margin: 0 0 2%;

  color: var(--gold);
  font-size: clamp(12px, 2.05vw, 31px);
  font-weight: 900;
  letter-spacing: .18em;
  text-transform: uppercase;

  text-shadow:
    0 0 5px #ffb52e,
    0 0 15px #ff1717,
    2px 3px 3px #000;

  animation: headingGlow 2s ease-in-out infinite alternate;
}

/* TIMER */

.timer {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: clamp(4px, 1vw, 17px);
  width: 100%;
  white-space: nowrap;
}

/* INDIVIDUAL UNITS */

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

/* NUMBER DISPLAY */

.number {
  position: relative;
  display: inline-block;

  color: #fff;

  font-family: Impact, Haettenschweiler,
               "Arial Narrow Bold", sans-serif;

  font-size: clamp(34px, 6.2vw, 94px);
  font-weight: 900;
  line-height: .95;
  letter-spacing: .025em;

  font-variant-numeric: tabular-nums;

  -webkit-text-stroke: 1.5px #850000;

  text-shadow:
    0 2px 0 #9b0000,
    0 4px 0 #540000,
    0 6px 0 #270000,
    0 0 8px rgba(255,255,255,.7),
    0 0 18px rgba(255,0,0,.9),
    0 0 35px rgba(255,0,0,.75);

  transform-origin: center center;
  transition: color .15s ease;
}

/* TICKER FLIP ANIMATION */

.number.tick {
  animation: tickerFlip .48s cubic-bezier(.2,.8,.3,1);
}

@keyframes tickerFlip {
  0% {
    transform: perspective(450px) rotateX(0deg) scale(1);
    filter: brightness(1);
  }

  25% {
    transform: perspective(450px) rotateX(-65deg) scale(1.13);
    filter: brightness(1.9);
    color: #ff3535;
  }

  50% {
    transform: perspective(450px) rotateX(70deg) scale(1.16);
    filter: brightness(2);
  }

  75% {
    transform: perspective(450px) rotateX(-12deg) scale(1.08);
    filter: brightness(1.5);
  }

  100% {
    transform: perspective(450px) rotateX(0deg) scale(1);
    filter: brightness(1);
  }
}

/* LABELS */

.label {
  margin-top: clamp(5px, .8vw, 12px);

  color: var(--gold);

  font-family: Arial, sans-serif;
  font-size: clamp(8px, 1.1vw, 17px);
  font-weight: 900;

  letter-spacing: .16em;

  text-shadow:
    0 0 7px #ff2525,
    0 2px 3px #000;
}

/* COLON */

.colon {
  align-self: flex-start;
  margin-top: .12em;

  color: var(--blood);
  font-size: clamp(30px, 5.5vw, 82px);
  font-weight: 900;
  line-height: .8;

  text-shadow:
    0 0 8px #ff0000,
    0 0 22px #ff0000,
    0 0 40px #ff0000;

  animation: colonPulse .8s steps(2,end) infinite;
}

@keyframes colonPulse {
  50% {
    opacity: .25;
    transform: scale(.88);
  }
}

/* RELEASE TEXT */

.release-time {
  margin: 2.5% 0 0;

  color: #fff;
  font-family: Arial, sans-serif;
  font-size: clamp(9px, 1.2vw, 18px);
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;

  text-shadow:
    0 0 8px #ff0000,
    0 2px 3px #000;
}

/* AMBIENT RED LIGHT */

.countdown::before {
  content: "";
  position: absolute;
  z-index: -1;

  width: 85%;
  height: 100%;

  background: radial-gradient(
    ellipse,
    rgba(255,0,0,.25) 0%,
    rgba(255,0,0,.09) 45%,
    transparent 75%
  );

  animation: bloodGlow 2.5s ease-in-out infinite alternate;
}

@keyframes bloodGlow {
  from {
    opacity: .4;
    transform: scale(.85);
  }

  to {
    opacity: 1;
    transform: scale(1.12);
  }
}

@keyframes headingGlow {
  from {
    text-shadow: 0 0 5px #ffb52e, 0 0 12px #ff1717;
  }

  to {
    text-shadow: 0 0 12px #ffd36a, 0 0 28px #ff1717;
  }
}

/* FINISHED MESSAGE */

.finished {
  display: none;

  color: var(--gold);
  font-size: clamp(26px, 5vw, 75px);
  font-weight: 900;
  line-height: 1.05;

  text-shadow:
    0 0 10px red,
    0 0 25px red,
    0 0 45px red;

  animation: reveal .7s ease-in-out infinite alternate;
}

@keyframes reveal {
  from {
    transform: scale(1);
    filter: brightness(1);
  }

  to {
    transform: scale(1.08);
    filter: brightness(1.7);
  }
}

.stage.is-finished .eyebrow,
.stage.is-finished .timer,
.stage.is-finished .release-time {
  display: none;
}

.stage.is-finished .finished {
  display: block;
}

/* RESPONSIVE */

@media (max-aspect-ratio: 3/2) {
  .stage {
    width: 100vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  .colon,
  .eyebrow,
  .finished,
  .countdown::before {
    animation: none;
  }

  .number.tick {
    animation: none;
  }
}
</style>
</head>

<body>

<main class="stage" id="stage"
      aria-label="Art the Clown release countdown">

  <section class="countdown" aria-live="off">

    <p class="eyebrow">
      THE NIGHTMARE BEGINS IN
    </p>

    <div class="timer">

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="label">HOURS</span>
      </div>

      <span class="colon">:</span>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="label">MINUTES</span>
      </div>

      <span class="colon">:</span>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="label">SECONDS</span>
      </div>

    </div>

    <p class="release-time">
      RELEASE TARGET · 10:30 PM LOCAL TIME
    </p>

    <div class="finished">
      HE'S HERE.<br>
      THE HUNT BEGINS!
    </div>

  </section>
</main>

<script>
const RELEASE_HOUR = 22;
const RELEASE_MINUTE = 30;

const stage = document.getElementById("stage");

const fields = {
  hours: document.getElementById("hours"),
  minutes: document.getElementById("minutes"),
  seconds: document.getElementById("seconds")
};

function getNextReleaseTime() {
  const now = new Date();
  const target = new Date(now);

  target.setHours(
    RELEASE_HOUR,
    RELEASE_MINUTE,
    0,
    0
  );

  if (target <= now) {
    target.setDate(target.getDate() + 1);
  }

  return target;
}

let releaseTarget = getNextReleaseTime();

function updateNumber(element, value) {
  const formatted = String(value).padStart(2, "0");

  if (element.textContent !== formatted) {
    element.textContent = formatted;

    // Restart the animation on every digit update.
    element.classList.remove("tick");

    void element.offsetWidth;

    element.classList.add("tick");
  }
}

function updateCountdown() {
  const now = new Date();

  const remaining = Math.max(
    0,
    releaseTarget.getTime() - now.getTime()
  );

  if (remaining <= 0) {
    stage.classList.add("is-finished");
    return;
  }

  const totalSeconds = Math.floor(remaining / 1000);

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  updateNumber(fields.hours, hours);
  updateNumber(fields.minutes, minutes);
  updateNumber(fields.seconds, seconds);
}

updateCountdown();

setInterval(updateCountdown, 250);
</script>

</body>
</html>
